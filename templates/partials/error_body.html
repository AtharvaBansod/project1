<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-5 text-center">
        <div class="error-code">{{ code }}</div>
        <h1 class="h4 mt-3">{{ heading }}</h1>
        <p class="text-muted">{{ message }}</p>
        <div class="d-flex justify-content-center flex-wrap gap-2 mt-2">
          <a class="btn btn-primary" href="{% url 'core:home' %}">Go to home page</a>
          <a class="btn btn-outline-primary" href="{% url 'catalog:list' %}">Browse products</a>
          {% if code == "403" or code == "401" %}<a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Sign in</a>{% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
